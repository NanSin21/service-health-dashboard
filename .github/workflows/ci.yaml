
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-code/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app-code/backend/go.mod
          cache-dependency-path: app-code/backend/go.sum

      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -coverprofile=coverage.out ./...

      - name: Report Go coverage
        run: go tool cover -func=coverage.out

      - name: Upload Go coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: app-code/backend/coverage.out

      - name: Build
        run: go build ./...

  frontend:
    name: React tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - run: npm run lint
      - run: npm run build
