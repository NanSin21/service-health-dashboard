
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-code/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app-code/backend/go.mod
          cache-dependency-path: app-code/backend/go.sum

      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

  frontend:
    name: React tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-code/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-code/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --run
      - run: npm run build
